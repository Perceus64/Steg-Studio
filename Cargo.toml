[package]
name = "steg-studio"
version = "0.1.0"
edition = "2021"
description = "Educational LSB steganography + steganalysis demo (Rust/Wasm)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: must match the wasm-bindgen CLI version in build.sh / CI
wasm-bindgen = "=0.2.100"
sha2 = "0.10"
aes-gcm = "0.10"
getrandom = "0.2"

# On wasm, getrandom must be told to use the browser's crypto RNG.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
